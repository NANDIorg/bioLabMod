# Карта исследований (GDD 4.13) — свой экран мода (API 111), только на
# стабильных хуках. Раньше `biolab-deep` подменял пустую ванильную книгу пятью
# перехватами внутренних функций, и клавиши до неё не доходили.
# Открыть: журнал применён «в воздух» — решает сервер (`native_use_item`,
