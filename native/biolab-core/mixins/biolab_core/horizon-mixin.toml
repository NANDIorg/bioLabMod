[mod]
id = "biolab_core"
version = "0.1.0"
priority = 100

# Коммит, на котором мод проверен. Используются только стабильные хук-поинты
# (hooks 1 в compatibility.json), поэтому лаунчер собирает его на любой версии
# Horizon, где они есть.
[compatibility]
horizon_revision = "d91cab68ded29bd2b004f7050c468fb98c41a00b"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "biolab_core"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "inventory"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_inventory_tick"
helper = "inventory.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "slot", ty = "i32", value = "slot" },
]

# Состояние игрока на мир: файл в папке мира. Стабильный хук API 31.
[[injection]]
id = "player-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_tick"
helper = "infection.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Машины: блок-сущность, её тик и слоты. Стабильные хуки API 15–17.
[[injection]]
id = "block-entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "machine_setup.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-ticks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_ticks"
helper = "machine_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-container"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_container"
helper = "machine_slots.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::chunk::block_entity::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "machine-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_tick"
helper = "machine.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::chunk::block_entity::ModBlockEntity", value = "&mut *entity" },
]

# Препарат: правый клик лечит. Стабильный хук API 13.
[[injection]]
id = "use-item"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item"
helper = "remedy.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "&*stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# Анализатор крови: панель в углу экрана. Стабильный хук API 1.
[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "analyzer.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

# Уровень заражения от сервера к клиенту. Стабильный хук API 40.
[[injection]]
id = "net-from-server"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_server"
helper = "net.rs"
bindings = [
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# Подсказка на колбе: свойства вещества. Стабильный хук API 12.
[[injection]]
id = "tooltip"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip"
helper = "tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "&*stack" },
  { name = "lines", ty = "&mut Vec<(horizon_client::text::Text, u32)>", value = "&mut *lines" },
]

# Команда /biolab на клиенте и просьбы к серверу. Хуки API 1 и 40.
[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]


# Ведро разливает лужу. Стабильный хук API 13.
[[injection]]
id = "use-item-on"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item_on"
helper = "place_fluid.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "&*stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# Шприц по мобу: правый клик по сущности. Стабильный хук API 29.
[[injection]]
id = "interact-entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_interact_entity"
helper = "inject.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "i32", value = "entity" },
  { name = "stack", ty = "Option<&horizon_client::items::ItemStack>", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# Мутанта убили: ткань убийце, лужа от нестабильного генома. Хук API 1.
[[injection]]
id = "mob-killed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mob_killed"
helper = "killed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "u32", value = "entity" },
]

# Сбор урожая с ГМ-грядки: правый клик по блоку, в том числе пустой рукой.
# Стабильный хук API 21.
[[injection]]
id = "right-click-block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "harvest.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Поведение мутантов, которому нужны все мобы разом. Висит на тике игрока:
# `native_level_tick_post` в одиночной игре не вызывается (проверено — вольеры
# не держали подопытных), а тик игрока работает всегда.
[[injection]]
id = "level-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_tick"
helper = "behaviour.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Удар по мутанту: шипы и ядовитая кровь. Стабильный хук API 39.
[[injection]]
id = "hurt-enemy"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hurt_enemy"
helper = "thorns.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "&*stack" },
  { name = "entity", ty = "u32", value = "entity" },
]

# Книга-гид: своя отрисовка поверх игры. Хук API 1.
[[injection]]
id = "book-hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "book.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# Клавиши книги: листание и закрытие. Хук API 1.
[[injection]]
id = "book-keys"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "keys.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]
