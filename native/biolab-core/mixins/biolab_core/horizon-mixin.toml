[mod]
id = "biolab_core"
version = "0.1.0"
priority = 100

# Коммит, на котором мод проверен. Используются только стабильные хук-поинты
# (hooks 1 в compatibility.json), поэтому лаунчер собирает его на любой версии
# Horizon, где они есть.
[compatibility]
horizon_revision = "31f83499b6c2cff7a8e7bf45f8173a7a95c2767c"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "biolab_core"
source = "runtime.rs"

# Свои частицы (GDD 3.9): таблица «что, где и как часто» без типов игры —
# её тесты идут обычным `cargo test` (`tests/particles.rs`). В игре —
# `crate::game::biolab_particles`. Тип частицы мода — API 103.
[[module]]
id = "particles"
file = "crates/horizon-client/src/game.rs"
name = "biolab_particles"
source = "particles.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
