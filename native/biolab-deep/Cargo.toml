[package]
name = "biolab-deep"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "BioLab: мутанты, их прибавки к атрибутам и внешний вид. Миксины на внутренние функции игры."

[lib]
path = "mixins/biolab_deep/runtime.rs"

# Только для тестов: пакет генов игроков собирает `biolab-core`, а разбирает
# `biolab_players` этого бандла — контракт проверяется настоящим кодом обеих
# сторон. В игру бандлы собираются отдельно, зависимости между ними нет.
[dev-dependencies]
biolab-core = { path = "../biolab-core" }
