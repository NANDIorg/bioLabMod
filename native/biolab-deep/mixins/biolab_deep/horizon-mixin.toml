[mod]
id = "biolab_deep"
version = "0.1.0"
priority = 100

# Этот бандл цепляется к ВНУТРЕННИМ функциям игры, а не к стабильным
# хук-поинтам, поэтому он привязан к коммиту и после обновления Horizon
# его цели нужно перепроверять.
[compatibility]
horizon_revision = "31f83499b6c2cff7a8e7bf45f8173a7a95c2767c"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "biolab_deep"
source = "runtime.rs"

# Урон и поведение своих эффектов (у игрока и у моба) живут в `biolab-core`
# на стабильных хуках API 56 (`effect_*.rs`). Здесь остались только прибавки
# к атрибутам и поведение мутанта по генам — см. `mob_tick.rs`.

# Модуль в крейте отрисовки: там живёт атлас HUD.
[[module]]
id = "mutants"
file = "crates/horizon-client/src/client_lib.rs"
name = "biolab_mutants"
source = "mutants.rs"

# Геном для отрисовки окно берёт из данных, пришедших с сервера (M11,
# `view_sync.rs` → `biolab_bridge`), а не с тика моба: перехват `base_tick`
# (`spawn.rs`) удалён вместе с метками.

# Внешность: оттенок всего тела.
[[injection]]
id = "mutant-tint"
kind = "RETURN"
target = "horizon_client_lib::mobs::render::body_color"
helper = "color.rs"
bindings = [
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "value", ty = "u32", value = "$value" },
]

# Внешность: размер поверх ванильного масштаба вида.
[[injection]]
id = "mutant-scale"
kind = "RETURN"
target = "horizon_client_lib::mobs::render::species_scale"
helper = "scale.rs"
bindings = [
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "value", ty = "glam::Mat4", value = "$value" },
]

# Операционная (GDD 4.17): моб на столе лежит, срезанные конечности — тонкие
# кости. Модуль — в lib-крейте, где живут `mobs` и отрисовка мобов. Состояние
# — данные `biolab:surgery` на мобе (ставит `biolab_core`, бит «спит» —
# проход мутантов), окну их переписывает `view_sync.rs`.
[[module]]
id = "surgery"
file = "crates/horizon-client/src/client_lib.rs"
name = "biolab_surgery"
source = "surgery.rs"

# Срезанные конечности не рисуются в общем проходе (тела и его слоёв). Прячем
# перед анимацией: в `render_visible` после `anim::setup` вставить нельзя —
# там замыкание `draw_body`, а в функции с замыканием допустимы только HEAD и
# RETURN. Анимация видимость конечностей мобов не возвращает.
[[injection]]
id = "surgery-hide-flayed"
kind = "HEAD"
target = "horizon_client_lib::mobs::anim::setup"
helper = "flay_hide.rs"
bindings = [
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "p", ty = "&mut crate::mobs::anim::Poses", value = "&mut *p" },
]

# Проход костей: после тела дорисовываем срезанные конечности тонкими и цвета
# кости (своя текстура `biolab:gui/surgery/bone` из общего атласа). RETURN
# трогает только хвост `if shell_last { draw_body(out); }` — в нём нет ни
# замыкания, ни вызова под ссылкой. `$value` — первым: аргументы помощника
# вычисляются по порядку, а хвост сам берёт `out` (`draw_body(out)`), так что
# `&mut *out` должен заимствоваться уже после него.
[[module]]
id = "growths"
file = "crates/horizon-client/src/client_lib.rs"
name = "biolab_growths"
source = "growths.rs"

# Проход наростов: второй RETURN на `render_visible`, рядом с проходом костей.
# RETURN-модификаторы одной функции складываются цепочкой (`$value` —
# результат предыдущего), так что оба прохода работают независимо. Те же
# привязки и тот же порядок: `$value` первым, `&mut *out` — последним.
[[module]]
id = "players"
file = "crates/horizon-client/src/client_lib.rs"
name = "biolab_players"
source = "players.rs"
visibility = "pub"

# Гены игроков больше не ходят своим пакетом (`genes_net.rs` удалён): с M11
# это данные игрока `biolab:player_genes` с `sync`, их переписывает в
# `biolab_players` тик окна (`view_sync.rs`).

# Рука в кадре: когти, перепонка, хитин, шипы, кость — на той руке, которую
# рисует игра (пустая рука, руки под картой). HEAD: в теле — замыкание позы.
[[injection]]
id = "first-person-arm-growths"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::first_person_arm"
helper = "arm_growths.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "left", ty = "bool", value = "left" },
  { name = "m", ty = "glam::Mat4", value = "m" },
  { name = "light", ty = "u32", value = "light" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

# Кадр от первого лица: третья рука у плеча и щупальца снизу — что бы ни было
# в руках. В саму `hand_geometry` встать нельзя (вложенный `use` в теле), но
# её буфер `render` сразу отдаёт сюда (вспышка тотема) — HEAD дописывает в
# него. Других вызовов у функции нет.
[[injection]]
id = "first-person-view-growths"
kind = "HEAD"
target = "horizon_client::game::totem::Game<'_>::item_activation_geometry"
helper = "view_growths.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "partial", ty = "f32", value = "partial" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

# Тик эффектов моба (`m.extra.effects`): модификатор скорости усыплённого —
# на него стабильного API нет. Поведение мутанта по генам с M11 — в проходе
# мутантов (`mutant_tick.rs`, в конце файла): геном теперь данные, их видит
# только бинарник. Урон и поведение самих эффектов — в `biolab-core` (API 56).
[[injection]]
id = "mob-effect-tick"
kind = "HEAD"
target = "horizon_client_lib::mobs::ai::tick_effects"
helper = "mob_tick.rs"
bindings = [
  { name = "m", ty = "&mut crate::mobs::Mob", value = "&mut *m" },
]

# Новые мобы в мире: геном по шансу вида — данными на мобе; призванный с
# метками старого формата сначала переносит их в данные. Бинарник: здесь
# видны и данные (`Host`), и `persist.raw`.
[[injection]]
id = "mobs-joined"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mobs_joined"
helper = "joined.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "from", ty = "usize", value = "from" },
]

# Загруженные мобы: `restore.rs` (метки обратно из `persist.raw` на каждом
# тике игрока) удалён. Данные мутанта грузятся с мобом сами, а прибавки и
# миграцию старых меток делает `loaded.rs` на `native_entities_load` (в
# конце файла).

# Карта исследований (журнал лаборанта) отсюда ушла: с M11 это свой экран
# мода на стабильных хуках в `biolab_core` (`research_*.rs`, GDD 4.13).
# Перехваты ванильной книги (`remote_use_item`, `use_book`, `draw_book`,
# `book_click`, `book_input`) больше не нужны.

# Кости срезанных конечностей и наросты мутантов рисуются вторым проходом
# поверх модели. Раньше оба прохода висели RETURN'ом на `render_visible`, но
# с ноября 2026 в ней появился `?`, а RETURN его не допускает (plan.rs,
# `try_outside_value`). Поэтому цепляемся к двум обёрткам без `?`, через
# которые моб и рисуется: `render_with` (обычный путь) и `render_skinned`
# (позирование на GPU). `base` в обёртках не готов — считаем его тем же
# `base_transform`, что и сама функция; `body_visible` там всегда `true`.
# Кости: обычный путь отрисовки.
[[injection]]
id = "surgery-bones"
kind = "RETURN"
target = "horizon_client_lib::mobs::render::render_with"
helper = "flayed_bones.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "atlas", ty = "crate::mobs::render::Atlas<'_>", value = "atlas" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&crate::mobs::MobData", value = "data" },
  { name = "out", ty = "&mut Vec<crate::mesher::Vertex>", value = "&mut *out" },
]

# Кости: путь с позированием на GPU.
[[injection]]
id = "surgery-bones-skinned"
kind = "RETURN"
target = "horizon_client_lib::mobs::render::render_skinned"
helper = "flayed_bones.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "atlas", ty = "crate::mobs::render::Atlas<'_>", value = "atlas" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&crate::mobs::MobData", value = "data" },
  { name = "out", ty = "&mut Vec<crate::mesher::Vertex>", value = "&mut *out" },
]

# Наросты: обычный путь отрисовки.
[[injection]]
id = "mutant-growths"
kind = "RETURN"
target = "horizon_client_lib::mobs::render::render_with"
helper = "growths_draw.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "atlas", ty = "crate::mobs::render::Atlas<'_>", value = "atlas" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&crate::mobs::MobData", value = "data" },
  { name = "out", ty = "&mut Vec<crate::mesher::Vertex>", value = "&mut *out" },
]

# Наросты: путь с позированием на GPU.
[[injection]]
id = "mutant-growths-skinned"
kind = "RETURN"
target = "horizon_client_lib::mobs::render::render_skinned"
helper = "growths_draw.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "atlas", ty = "crate::mobs::render::Atlas<'_>", value = "atlas" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&crate::mobs::MobData", value = "data" },
  { name = "out", ty = "&mut Vec<crate::mesher::Vertex>", value = "&mut *out" },
]

# ---- M11: данные мутанта на сущностях (attachments) вместо меток ----
#
# Геном (`biolab:genome`), операционная (`biolab:surgery`), отметка броска
# (`biolab:mutation_checked`) и гены игрока (`biolab:player_genes`) — свои
# данные на носителе с кодеком (сохраняются с мобом); геном, операционная и
# гены игрока — с `sync` (сами едут в окно). Прибавки к атрибутам остаются
# модификаторами: у них стабильного API нет. GDD 3.10.

# Типы данных и доступ к ним: в бинарнике, рядом с `Game` (`Host`).
[[module]]
id = "data"
file = "crates/horizon-client/src/game.rs"
name = "biolab_deep_data"
source = "data.rs"

# Мост бинарник ↔ lib: что гены значат и таблицы отрисовки живут в lib, а
# данные видит только бинарник. Открыт наружу — только std и `mobs::Mob`.
[[module]]
id = "bridge"
file = "crates/horizon-client/src/client_lib.rs"
name = "biolab_bridge"
source = "bridge.rs"
visibility = "pub"

# Проход мутантов на сервере перед тиком мобов: прибавки по геному, бит
# «спит», поведение по генам. Стабильный хук API 146: игра спрашивает его на
# сервере перед каждым семейством сущностей; `listened` не ставим.
[[injection]]
id = "mutant-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_entity_tick_listened"
helper = "mutant_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Мобы чанка загрузились: миграция старых меток в данные, прибавки по
# геному и здоровье из сейва. Стабильный хук API 210.
[[injection]]
id = "entities-loaded"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_entities_load"
helper = "loaded.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "chunk", ty = "[i32; 2]", value = "chunk" },
]

# Окно: пришедшие с сервера данные — в таблицы отрисовки, раз в тик окна.
# Стабильный хук (тик каждого `Game`; у окна — из `tick_remote`).
[[injection]]
id = "view-sync"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "view_sync.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Игрок начал видеть сущность: разослать её данные заново. Свой снимок при
# начале слежения игра шлёт только при загруженном трейт-моде
# (`hub.sync_attachments`), а наши бандлы — миксины. Стабильный хук API 141.
[[injection]]
id = "start-tracking"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_start_tracking"
helper = "tracking.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "u32", value = "entity" },
  { name = "uuid", ty = "u128", value = "uuid" },
  { name = "kind", ty = "&str", value = "kind" },
]
