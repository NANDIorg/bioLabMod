]

# Карта исследований вместо ванильной книги. Журнал лаборанта открывает
# пустой экран книги: он даёт свободный курсор, мышь и клавиши, а рисуем и
# отвечаем мы. Узлы и записи — в `biolab_core` (карта исследований).
[[injection]]
id = "research-open"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::remote::Game<'_>::remote_use_item"
helper = "research_open.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "hand", ty = "horizon_client::first_person::Hand", value = "hand" },
]

