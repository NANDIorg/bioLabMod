[mod]
id = "biolab_deep"
version = "0.1.0"
priority = 100

# Этот бандл цепляется к ВНУТРЕННИМ функциям игры, а не к стабильным
# хук-поинтам, поэтому он привязан к коммиту и после обновления Horizon
# его цели нужно перепроверять.
[compatibility]
horizon_revision = "d91cab68ded29bd2b004f7050c468fb98c41a00b"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "biolab_deep"
source = "runtime.rs"

# Серверный тик эффектов игрока (LivingEntity.tickEffects). Ванильные эффекты
# разбираются хардкодом по строкам, наши — здесь.
[[injection]]
id = "effect-tick"
kind = "HEAD"
target = "horizon_client::game::potions::Game<'_>::tick_mob_effects"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Модуль в крейте отрисовки: там живёт атлас HUD.
[[module]]
id = "icons"
file = "crates/horizon-client-render/src/lib.rs"
name = "biolab_icons"
source = "atlas.rs"

# Иконки эффектов модов: псевдоним в атласе под ключом, который ищет движок.
# RETURN здесь не встаёт: функция объявлена как `-> Result<Self>`, а инструменту
# нужен конкретный тип. Поэтому правим значение самого выражения — его тип
# объявляем сами.
[[injection]]
id = "atlas-icons"
kind = "MODIFY_EXPRESSION_VALUE"
target = "horizon_client_render::hud::HudAtlas::build_over"
selector = 'Self::pack(root, defaults, &["gui", "item", "block", "font", "environment", "misc", "painting", "entity", "particle", "mob_effect", "map",], true,)'
require = 1
ordinal = 0
helper = "icons.rs"
bindings = [
  { name = "value", ty = "crate::Result<crate::hud::HudAtlas>", value = "$value" },
]

# Модуль мутантов: в lib-крейте horizon-client, где живёт `mobs`.
[[module]]
id = "mutants"
file = "crates/horizon-client/src/lib.rs"
name = "biolab_mutants"
source = "mutants.rs"

# Геном для отрисовки: на тике моба узнаём его по метке на самом мобе.
[[injection]]
id = "mutate-on-spawn"
kind = "HEAD"
target = "horizon_client::mobs::ai::base_tick"
helper = "spawn.rs"
bindings = [
  { name = "m", ty = "&mut crate::mobs::Mob", value = "&mut *m" },
]

# Внешность: оттенок всего тела.
[[injection]]
id = "mutant-tint"
kind = "RETURN"
target = "horizon_client::mobs::render::body_color"
helper = "color.rs"
bindings = [
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "value", ty = "u32", value = "$value" },
]

# Внешность: размер поверх ванильного масштаба вида.
[[injection]]
id = "mutant-scale"
kind = "RETURN"
target = "horizon_client::mobs::render::species_scale"
helper = "scale.rs"
bindings = [
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "value", ty = "glam::Mat4", value = "$value" },
]

# Операционная (GDD 4.17): моб на столе лежит, срезанные конечности — тонкие
# кости. Модуль — в lib-крейте, где живут `mobs` и отрисовка мобов. Метки
# (`biolab:surgery/table`, `biolab:surgery/flayed/N`) ставит `biolab_core`.
[[module]]
id = "surgery"
file = "crates/horizon-client/src/lib.rs"
name = "biolab_surgery"
source = "surgery.rs"

# Срезанные конечности не рисуются в общем проходе (тела и его слоёв). Прячем
# перед анимацией: в `render_visible` после `anim::setup` вставить нельзя —
# там замыкание `draw_body`, а в функции с замыканием допустимы только HEAD и
# RETURN. Анимация видимость конечностей мобов не возвращает.
[[injection]]
id = "surgery-hide-flayed"
kind = "HEAD"
target = "horizon_client::mobs::anim::setup"
helper = "flay_hide.rs"
bindings = [
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "p", ty = "&mut crate::mobs::anim::Poses", value = "&mut *p" },
]

# Проход костей: после тела дорисовываем срезанные конечности тонкими и цвета
# кости (своя текстура `biolab:gui/surgery/bone` из общего атласа). RETURN
# трогает только хвост `if shell_last { draw_body(out); }` — в нём нет ни
# замыкания, ни вызова под ссылкой. `$value` — первым: аргументы помощника
# вычисляются по порядку, а хвост сам берёт `out` (`draw_body(out)`), так что
# `&mut *out` должен заимствоваться уже после него.
[[injection]]
id = "surgery-bones"
kind = "RETURN"
target = "horizon_client::mobs::render::render_visible"
helper = "flayed_bones.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "base", ty = "glam::Mat4", value = "base" },
  { name = "atlas", ty = "crate::mobs::render::Atlas<'_>", value = "atlas" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&crate::mobs::MobData", value = "data" },
  { name = "body_visible", ty = "bool", value = "body_visible" },
  { name = "out", ty = "&mut Vec<crate::mesher::Vertex>", value = "&mut *out" },
]

# Наросты мутантов (GDD 4.19): рога, хвост, щупальца, третья рука, вторая
# голова, шипы, глаза и т. д. Модуль — в lib-крейте, где живут `mobs` и
# отрисовка мобов; геном берётся из общей памяти `biolab_mutants` по id моба.
[[module]]
id = "growths"
file = "crates/horizon-client/src/lib.rs"
name = "biolab_growths"
source = "growths.rs"

# Проход наростов: второй RETURN на `render_visible`, рядом с проходом костей.
# RETURN-модификаторы одной функции складываются цепочкой (`$value` —
# результат предыдущего), так что оба прохода работают независимо. Те же
# привязки и тот же порядок: `$value` первым, `&mut *out` — последним.
[[injection]]
id = "mutant-growths"
kind = "RETURN"
target = "horizon_client::mobs::render::render_visible"
helper = "growths_draw.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "base", ty = "glam::Mat4", value = "base" },
  { name = "atlas", ty = "crate::mobs::render::Atlas<'_>", value = "atlas" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&crate::mobs::MobData", value = "data" },
  { name = "body_visible", ty = "bool", value = "body_visible" },
  { name = "out", ty = "&mut Vec<crate::mesher::Vertex>", value = "&mut *out" },
]

# Наросты на игроке (GDD 4.19, этап «игрок»). Гены игрока живут на сервере
# (`biolab-core`, `PlayerState.genes`) и приходят пакетом `biolab_core:genes`;
# здесь они хранятся для отрисовки и раскладываются по моделям игроков.
# Открытый модуль (`pub`): его зовут перехваты в бинарнике — приём пакета и
# рука в кадре; модель игрока в третьем лице читает его изнутри lib
# (`biolab_growths::draw_growths`, тот же RETURN на `render_visible`).
[[module]]
id = "players"
file = "crates/horizon-client/src/lib.rs"
name = "biolab_players"
source = "players.rs"
visibility = "pub"

# Пакет генов от сервера. Стабильный хук API 40; core ловит здесь же свои
# каналы (`net.rs`), каждый перехват берёт свой канал. `persist.uuids` (id
# сущности → uuid) — чтобы найти модели других игроков.
[[injection]]
id = "player-genes-net"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_server"
helper = "genes_net.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# Рука в кадре: когти, перепонка, хитин, шипы, кость — на той руке, которую
# рисует игра (пустая рука, руки под картой). HEAD: в теле — замыкание позы.
[[injection]]
id = "first-person-arm-growths"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::first_person_arm"
helper = "arm_growths.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "left", ty = "bool", value = "left" },
  { name = "m", ty = "glam::Mat4", value = "m" },
  { name = "light", ty = "u32", value = "light" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

# Кадр от первого лица: третья рука у плеча и щупальца снизу — что бы ни было
# в руках. В саму `hand_geometry` встать нельзя (вложенный `use` в теле), но
# её буфер `render` сразу отдаёт сюда (вспышка тотема) — HEAD дописывает в
# него. Других вызовов у функции нет.
[[injection]]
id = "first-person-view-growths"
kind = "HEAD"
target = "horizon_client::game::totem::Game<'_>::item_activation_geometry"
helper = "view_growths.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "partial", ty = "f32", value = "partial" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

# Модуль эффектов мобов: в lib-крейте, где живёт `mobs`.
[[module]]
id = "mob-effects"
file = "crates/horizon-client/src/lib.rs"
name = "biolab_effects"
source = "effects.rs"

# Эффекты мобов тикают отдельно от игрока (`m.extra.effects`).
[[injection]]
id = "mob-effect-tick"
kind = "HEAD"
target = "horizon_client::mobs::ai::tick_effects"
helper = "mob_tick.rs"
bindings = [
  { name = "m", ty = "&mut crate::mobs::Mob", value = "&mut *m" },
]

# Мобы появились в мире: новым мобам — геном по шансу вида, загруженным мутантам — их
# модификаторы обратно из сырого NBT. Бинарник: здесь виден `persist.raw`.
[[injection]]
id = "mobs-joined"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mobs_joined"
helper = "joined.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "from", ty = "usize", value = "from" },
]

# Загруженные мобы: Horizon не читает модификаторы из сейва и не зовёт для
# них `native_mobs_joined`. Возвращаем наши метки и прибавки на тике игрока,
# каждому мобу один раз (`restore.rs`).
[[injection]]
id = "restore-loaded"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_tick"
helper = "restore.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Модуль своей вкладки: в lib-крейте, где живёт `creative`.
[[module]]
id = "tab"
file = "crates/horizon-client/src/lib.rs"
name = "biolab_tab"
source = "tab.rs"

# Вкладка творческого инвентаря: дописываем её после перестройки списка.
[[injection]]
id = "creative-tab"
kind = "RETURN"
target = "horizon_client::creative::Creative::rebuild"
helper = "creative.rs"
bindings = [
  { name = "creative", ty = "&mut crate::creative::Creative", value = "&mut *self" },
