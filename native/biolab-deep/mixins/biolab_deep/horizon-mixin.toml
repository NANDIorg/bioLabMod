# Кости срезанных конечностей и наросты мутантов рисуются вторым проходом
# поверх модели. Раньше оба прохода висели RETURN'ом на `render_visible`, но
# с ноября 2026 в ней появился `?`, а RETURN его не допускает (plan.rs,
# `try_outside_value`). Поэтому цепляемся к двум обёрткам без `?`, через
# которые моб и рисуется: `render_with` (обычный путь) и `render_skinned`
# (позирование на GPU). `base` в обёртках не готов — считаем его тем же
# `base_transform`, что и сама функция; `body_visible` там всегда `true`.
# Кости: обычный путь отрисовки.
[[injection]]
id = "surgery-bones"
kind = "RETURN"
target = "horizon_client_lib::mobs::render::render_with"
helper = "flayed_bones.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "atlas", ty = "crate::mobs::render::Atlas<'_>", value = "atlas" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&crate::mobs::MobData", value = "data" },
  { name = "out", ty = "&mut Vec<crate::mesher::Vertex>", value = "&mut *out" },
]

# Кости: путь с позированием на GPU.
[[injection]]
id = "surgery-bones-skinned"
kind = "RETURN"
target = "horizon_client_lib::mobs::render::render_skinned"
helper = "flayed_bones.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "m", ty = "&crate::mobs::Mob", value = "&*m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "atlas", ty = "crate::mobs::render::Atlas<'_>", value = "atlas" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&crate::mobs::MobData", value = "data" },
  { name = "out", ty = "&mut Vec<crate::mesher::Vertex>", value = "&mut *out" },
]

